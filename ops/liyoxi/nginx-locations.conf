# Include inside the existing myspace.byfire.ai HTTPS server only.
location = /liyoxi {
    return 308 /liyoxi/$is_args$args;
}
location ^~ /liyoxi/api/ {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8797;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    access_log off;
}
location = /liyoxi/admin {
    return 308 /liyoxi/admin/$is_args$args;
}
location ^~ /liyoxi/admin/ {
    proxy_pass http://127.0.0.1:8797;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    access_log off;
}
location ^~ /liyoxi/ {
    alias /opt/liyoxi/current/public/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
